name: Composite Assurance Protocol CI

# Permanent CAP verification contour.
on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: cap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema
      - name: Run CAP checks
        run: |
          python -m unittest discover -v
          python -m json.tool ARTIFACT.json >/dev/null
          python -m json.tool PROFILE_LOCK.json >/dev/null
          python -m json.tool lifecycle/LIFECYCLE.json >/dev/null
          python -m json.tool schema/composite-assessment-record.schema.json >/dev/null
          python validator/cap_validate.py examples/bounded-runtime-assessment.json
          python -m review.test_artifact_canon
          python -m review.test_release_0_2

  independent-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run independent Node conformance
        run: |
          node independent/node/test_conformance.mjs
          node independent/node/cap_validate.mjs examples/bounded-runtime-assessment.json

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema
      - name: Run adversarial cross-runtime differential suite
        run: python -m unittest conformance.test_differential -v
